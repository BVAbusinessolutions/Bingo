<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a1128" />
    <meta
      name="description"
      content="Bingo benéfico de la Asociación Infantil Hogar Sol en Costa Rica. Compra tus cartones en línea y juega en vivo, desde tu casa o en el salón del evento."
    />
    <meta name="robots" content="index, follow" />
    <!-- __SITE_ORIGIN__ lo reemplaza el servidor por CLIENT_ORIGIN (URL pública) al entregar la página. -->
    <link rel="canonical" href="__SITE_ORIGIN__/" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- SEO local: Costa Rica -->
    <meta name="geo.region" content="CR-SJ" />
    <meta name="geo.placename" content="San José, Costa Rica" />
    <meta name="language" content="es-CR" />
    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CR" />
    <meta property="og:site_name" content="Bingo Benéfico Hogar Sol" />
    <meta property="og:title" content="Bingo Benéfico · Asociación Infantil Hogar Sol" />
    <meta
      property="og:description"
      content="Juega bingo y ayuda a la niñez. Compra tus cartones y juega en vivo, en el salón o en línea."
    />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <meta property="og:image" content="__SITE_ORIGIN__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de la Asociación Infantil Hogar Sol y el texto Gran Bingo Benéfico" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bingo Benéfico · Asociación Infantil Hogar Sol" />
    <meta name="twitter:description" content="Juega bingo y ayuda a la niñez. Compra tus cartones y juega en vivo." />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og-image.png" />
    <!-- Datos estructurados (Google) del evento vigente: el servidor reemplaza __EVENT_JSONLD__ con lo que define el panel. -->
    <script type="application/ld+json">__EVENT_JSONLD__</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Bingo Benéfico · Asociación Infantil Hogar Sol</title>
    <script>
      // Aplica el tema y el tamaño de letra antes de pintar para evitar el destello blanco en modo noche.
      try {
        var t = localStorage.getItem('hs-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        var s = localStorage.getItem('hs-text-size');
        if (s === 'large' || s === 'xlarge') document.documentElement.dataset.textSize = s;
        if (localStorage.getItem('hs-contrast') === 'high') document.documentElement.dataset.contrast = 'high';
        if (localStorage.getItem('hs-motion') === 'reduce') document.documentElement.dataset.motion = 'reduce';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
