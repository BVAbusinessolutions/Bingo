# Despliegue en Render (https://render.com) como un solo servicio: la API sirve también la web compilada.
# Render da HTTPS automático. La base de datos es Supabase (DATABASE_URL). Ver docs/DESPLIEGUE.md
services:
  - type: web
    name: bingo-hogar-sol
    runtime: node
    plan: starter # el plan gratis se duerme y corta el sorteo en vivo; usa uno de pago para el evento
    region: virginia # misma zona que Supabase (us-east-1)
    buildCommand: npm run build:prod
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.13.0
      - key: TRUST_PROXY
        value: '1'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # pegar la cadena del "Session pooler" de Supabase
      - key: DATABASE_CA_CERT
        value: supabase-ca.crt # certificado público de Supabase (server/supabase-ca.crt), verifica el TLS
      - key: CLIENT_ORIGIN
        sync: false # https://tu-dominio (o la URL .onrender.com)
      - key: ADMIN_NOTIFY_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_SECURE
        value: 'true'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Datos públicos de contacto: Vite los incrusta en la web al compilar (client/.env no se sube a git)
      - key: VITE_CONTACT_EMAIL
        sync: false
      - key: VITE_CONTACT_PHONE
        sync: false
      - key: VITE_CONTACT_WHATSAPP
        sync: false # solo dígitos, con código de país (506...)
      - key: VITE_CONTACT_ADDRESS
        sync: false
      - key: VITE_CONTACT_SCHEDULE
        sync: false
